name: Tests

# The animation workflow runs once a day and talks to S3; this one runs on
# every change and does not, so a broken renderer or a broken page is caught
# when it is pushed rather than the next morning.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # test_labels.py draws real basemaps, at the coarse 50 m scale.
      - name: Cache Natural Earth basemap
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-naturalearth-10m-50m-v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff playwright
          playwright install --with-deps chromium

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest tests -q
