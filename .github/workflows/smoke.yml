name: Puget Sound smoke

on:
  schedule:
    # Only the 00/06/12/18Z cycles forecast out to 48 hours, and they finish
    # about 1.8 h after the cycle time (12Z lands ~13:47Z). 14:30 UTC leaves
    # ~40 min of margin and is 7:30 AM PDT / 6:30 AM PST.
    #
    # GitHub's cron often fires late, which is only ever safer here: --extended
    # holds out for a cycle that has published all 48 hours, so a late run
    # still gets a complete forecast rather than a half-written one.
    - cron: "30 14 * * *"

  # A change to the page or the workflow should publish itself rather than wait
  # for tomorrow's cron. Without this, merging a Pages change leaves the site
  # un-deployed and looking broken until the next scheduled run.
  push:
    branches: [main]
    paths:
      - ".github/workflows/smoke.yml"
      - "hrrr_smoke/site.py"
      - "hrrr_smoke/archive.py"

  workflow_dispatch:
    inputs:
      force:
        description: "Render even if Seattle stays below the threshold"
        type: boolean
        default: false
      threshold:
        description: "Lowest AQI category worth rendering"
        type: choice
        default: moderate
        options: [good, moderate, sensitive, unhealthy, very-unhealthy, hazardous]
      hours:
        description: "Forecast hours to animate"
        default: "48"
      step:
        description: "Hours between frames (2 halves the frame count and file size)"
        default: "1"

permissions:
  contents: write   # commit the animation back to runs/
  pages: write      # publish the page
  id-token: write   # required by deploy-pages

# Two runs pushing to runs/ at once would race on the same branch.
concurrency:
  group: puget-smoke
  cancel-in-progress: false

jobs:
  animate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache Natural Earth basemap
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-naturalearth-10m-50m-v2

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          # gifsicle is optional -- make_gif writes a valid GIF without it and
          # only skips the extra -O3 pass -- but it is a few hundred KB off
          # every animation for a two-second install.
          sudo apt-get install -y -qq ffmpeg gifsicle
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render when Seattle has seen moderate or worse smoke
        id: smoke
        env:
          FORCE: ${{ inputs.force }}
          THRESHOLD: ${{ inputs.threshold || 'moderate' }}
          HOURS: ${{ inputs.hours || '48' }}
          STEP: ${{ inputs.step || '1' }}
        run: |
          gate="--gate"
          if [ "$FORCE" = "true" ]; then
            echo "Manual override: rendering regardless of the gate."
            gate=""
          fi
          python -m hrrr_smoke \
            $gate \
            --extended \
            --gate-city Seattle \
            --gate-threshold "$THRESHOLD" \
            --gate-days 1 \
            --hours "$HOURS" \
            --step "$STEP" \
            --archive runs \
            --site site \
            --prune-days 30 \
            --prune-keep-above unhealthy \
            --prune-non-extended

      # Release assets live outside git history, so a permanent link to the
      # newest animation costs nothing in repository size. Rolling the `latest`
      # tag keeps the URL below stable forever:
      #   .../releases/latest/download/puget_smoke_latest.gif
      - name: Publish as the latest run
        if: steps.smoke.outputs.rendered == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE: ${{ steps.smoke.outputs.cycle }}
        run: |
          for ext in gif mp4 png; do
            src=$(ls out/*."$ext" 2>/dev/null | head -1) || true
            [ -n "$src" ] && cp "$src" "puget_smoke_latest.$ext"
          done
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest puget_smoke_latest.* \
            --title "Latest Puget Sound smoke forecast" \
            --notes "HRRR $CYCLE — ${{ steps.smoke.outputs.summary }}

          This release is replaced on every run, so its download URLs always
          point at the most recent animation."

      - name: Commit the animation
        if: steps.smoke.outputs.rendered == 'true'
        env:
          PRUNED: ${{ steps.smoke.outputs.pruned }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A so that pruned deletions are staged, not just new files.
          git add -A runs
          if git diff --cached --quiet; then
            echo "runs/ already had this cycle; nothing to commit."
            exit 0
          fi
          note=""
          if [ "${PRUNED:-0}" != "0" ]; then
            note="

          Pruned $PRUNED quiet run(s) older than 30 days."
          fi
          git commit -m "Add ${{ steps.smoke.outputs.cycle }} Puget Sound smoke run

          ${{ steps.smoke.outputs.summary }}$note"
          # The scheduled job races nothing, but a manual dispatch can land
          # while another run is mid-flight.
          git pull --rebase --autostash origin main
          git push

      - name: Upload the animation
        if: steps.smoke.outputs.rendered == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ steps.smoke.outputs.cycle }}
          path: |
            out/*.gif
            out/*.mp4
            out/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy the page
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Report
        if: always()
        run: |
          if [ "${{ steps.smoke.outputs.rendered }}" = "true" ]; then
            echo "### Smoke animation built" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No animation — clean air" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.smoke.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"
